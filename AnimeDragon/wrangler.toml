name = "animedragon-ultra"
main = "worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./web"

[[d1_databases]]
binding = "DB"
database_name = "animedragon-db"
database_id = "COLOQUE-SEU-D1-ID-AQUI"

[[r2_buckets]]
binding = "AVATARS"
bucket_name = "animedragon-avatars"

[triggers]
crons = ["0 */6 * * *"]

# Configure the secret separately:
# wrangler secret put TMDB_API_KEY
