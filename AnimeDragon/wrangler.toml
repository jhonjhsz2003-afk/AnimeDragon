name = "animedragon-ultra"
main = "worker.js"
compatibility_date = "2026-09-12"

[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "animedragon-db"
database_id = "fdf0ea3e-42f9-46a3-b92f-e8b9632cca63"

[[r2_buckets]]
binding = "AVATARS"
bucket_name = "animedragon-avatars"

[triggers]
crons = ["0 */6 * * *"]

[observability]
enabled = true
